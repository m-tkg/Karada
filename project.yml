name: Karada
options:
  bundleIdPrefix: com.mtkg
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0.18"
    CURRENT_PROJECT_VERSION: "19"
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic

# DEVELOPMENT_TEAM / PRODUCT_BUNDLE_IDENTIFIER は xcconfig で定義する。
# project.yml の settings に書くとビルド設定へ直接展開され xcconfig より優先
# されてしまい、各自による上書きができなくなるため。
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

targets:
  Karada:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: App
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: App/Karada.entitlements
        TARGETED_DEVICE_FAMILY: 1
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: カラダ
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # ネットワーク通信を一切行わないため輸出コンプライアンス対象外
        ITSAppUsesNonExemptEncryption: false
        NSHealthShareUsageDescription: "ヘルスケアのデータを読み取り、端末上でダッシュボードを作成するために使用します。"
        NSHealthUpdateUsageDescription: "開発用のデモデータ投入にのみ使用します。"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait

schemes:
  Karada:
    build:
      targets:
        Karada: all
    run:
      config: Debug
    archive:
      config: Release
