name: Karada
options:
  bundleIdPrefix: com.mtkg
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0.11"
    CURRENT_PROJECT_VERSION: "12"
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: G72M73C546
    CODE_SIGN_STYLE: Automatic

targets:
  Karada:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mtkg.karada
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: App/Karada.entitlements
        TARGETED_DEVICE_FAMILY: 1
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: カラダ
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # ネットワーク通信を一切行わないため輸出コンプライアンス対象外
        ITSAppUsesNonExemptEncryption: false
        NSHealthShareUsageDescription: "ヘルスケアのデータを読み取り、端末上でダッシュボードを作成するために使用します。"
        NSHealthUpdateUsageDescription: "開発用のデモデータ投入にのみ使用します。"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait

schemes:
  Karada:
    build:
      targets:
        Karada: all
    run:
      config: Debug
    archive:
      config: Release
